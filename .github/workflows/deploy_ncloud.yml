name: Deploy to Naver Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ncloud-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NCLOUD_HOST }}
          username: ${{ secrets.NCLOUD_USER }}
          key: ${{ secrets.NCLOUD_SSH_KEY }}
          port: ${{ secrets.NCLOUD_PORT }}
          script_stop: true
          script: |
            set -e

            APP_DIR="${{ secrets.NCLOUD_APP_DIR }}"
            BRANCH="main"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "[ERROR] APP_DIR is not a git repository: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ -f requirements.txt ]; then
              python3 -m pip install --upgrade pip
              python3 -m pip install -r requirements.txt
            fi

            sudo systemctl restart naver-rank-dashboard.service
            sudo systemctl restart naver-rank-collector.service

            sudo systemctl is-active --quiet naver-rank-dashboard.service
            sudo systemctl is-active --quiet naver-rank-collector.service

            echo "[OK] Deploy and restart completed."