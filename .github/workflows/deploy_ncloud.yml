name: Deploy to Naver Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ncloud-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NCLOUD_HOST }}
          username: ${{ secrets.NCLOUD_USER }}
          key: ${{ secrets.NCLOUD_SSH_KEY }}
          port: ${{ secrets.NCLOUD_PORT }}
          script_stop: true
          script: |
            set -e

            APP_DIR="${{ secrets.NCLOUD_APP_DIR }}"
            BRANCH="${{ secrets.NCLOUD_DEPLOY_BRANCH }}"
            DASHBOARD_SERVICE="${{ secrets.NCLOUD_DASHBOARD_SERVICE }}"
            COLLECTOR_SERVICE="${{ secrets.NCLOUD_COLLECTOR_SERVICE }}"

            if [ -z "$BRANCH" ]; then
              BRANCH="main"
            fi

            if [ -z "$DASHBOARD_SERVICE" ] || [ -z "$COLLECTOR_SERVICE" ]; then
              echo "[ERROR] Service secrets are missing."
              echo "Set NCLOUD_DASHBOARD_SERVICE and NCLOUD_COLLECTOR_SERVICE"
              exit 1
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "[ERROR] APP_DIR is not a git repository: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ -f requirements.txt ]; then
              python3 -m pip install --upgrade pip
              python3 -m pip install -r requirements.txt
            fi

            sudo systemctl restart "$DASHBOARD_SERVICE"
            sudo systemctl restart "$COLLECTOR_SERVICE"

            sudo systemctl is-active --quiet "$DASHBOARD_SERVICE"
            sudo systemctl is-active --quiet "$COLLECTOR_SERVICE"

            echo "[OK] Deploy and restart completed."