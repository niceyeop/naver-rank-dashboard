name: Deploy to Naver Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USER }}
          key: ${{ secrets.NCP_SSH_KEY }}
          script_stop: true
          script: |
            export APP_DIR="${{ secrets.NCP_APP_DIR }}"
            export SERVICE_NAME="${{ secrets.NCP_SERVICE_NAME }}"
            export APP_PORT="${{ secrets.NCP_APP_PORT }}"

            if [ -z "$APP_DIR" ]; then
              echo "NCP_APP_DIR secret is required"
              exit 1
            fi

            if [ -z "$SERVICE_NAME" ]; then
              echo "NCP_SERVICE_NAME secret is required"
              exit 1
            fi

            cd "$APP_DIR"
            chmod +x deploy/deploy.sh deploy/run_dashboard.sh
            APP_PORT="$APP_PORT" SERVICE_NAME="$SERVICE_NAME" ./deploy/deploy.sh
